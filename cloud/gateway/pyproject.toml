[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "polycare-gateway"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "qdrant-client[fastembed]>=1.12,<2",
  "uvicorn[standard]>=0.34,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
