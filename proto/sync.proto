syntax = "proto3";

package polycare.sync.v1;

// The authoritative sync data model. HTTP JSON uses the same field names and values.
message Hlc {
  uint64 wall_ms = 1;
  uint32 logical = 2;
  string node = 3;
}

message Op {
  string op_id = 1;       // UUIDv7 idempotency key
  string device_id = 2;
  Hlc hlc = 3;
  string kind = 4;        // SIGNAL | VOTE | GAP (a question for supervisors) | TIP (a shared tip)
  bytes payload_json = 5; // canonical UTF-8 JSON for the operation body
  bytes prev_hash = 6;    // SHA-256 hash-chain link; 32 zero bytes for the first op
  bytes signature = 7;    // Ed25519 signature over canonical fields 1..6
}

message PushRequest { repeated Op ops = 1; }
message PushAck {
  repeated string accepted_op_ids = 1;
  repeated string duplicate_op_ids = 2;
  bytes chain_head = 3;
}

message DeviceRegistration {
  string device_id = 1;
  bytes ed25519_public_key = 2;
}

message ChallengeRequest { string device_id = 1; }
message Challenge {
  string challenge_id = 1;
  bytes nonce = 2;
  uint64 expires_at_ms = 3;
}

message ChallengeResponse {
  string challenge_id = 1;
  string device_id = 2;
  bytes signature = 3;
}
